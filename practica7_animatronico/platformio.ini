; Practica 7: Animatronico
; ESP32 + sensor PIR HC-SR501 + servo SG90 + DFPlayer Mini + 2 LEDs

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    madhephaestus/ESP32Servo
    dfrobot/DFRobotDFPlayerMini
